[workspace]
members = ["contracts/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Carlys17/soroban-vesting"

[workspace.dependencies]
soroban-sdk = "22.0.11"

[profile.release]
opt-level = "z"
lto = true
debug = false
strip = "symbols"
panic = "abort"
